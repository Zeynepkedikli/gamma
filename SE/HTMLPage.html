<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }

        .image-container {
            width: 100%;
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

            img:hover {
                transform: scale(1.05);
            }

        .slider-container {
            width: 100%;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }

            input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 25px;
                height: 25px;
                background: #667eea;
                border-radius: 50%;
                cursor: pointer;
                transition: 0.3s ease;
            }

                input[type="range"]::-webkit-slider-thumb:hover {
                    background: #764ba2;
                    transform: scale(1.2);
                }

            input[type="range"]::-moz-range-thumb {
                width: 25px;
                height: 25px;
                background: #667eea;
                border-radius: 50%;
                cursor: pointer;
                border: none;
            }

        .image-info {
            margin-top: 20px;
            color: #666;
            font-size: 16px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 22px;
            }

            .image-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Image Slider</h2>

        <div class="image-container">
            <img id="image" src="foto1.jpg" alt="Slider Image">
        </div>

        <div class="slider-container">
            <input type="range" min="1" max="3" value="1" id="slider">
        </div>

        <div class="image-info">
            <p>Image: <span id="imageNumber">1</span> / 3</p>
        </div>
    </div>

    <script>
        const slider = document.getElementById("slider");
        const image = document.getElementById("image");
        const imageNumber = document.getElementById("imageNumber");

        slider.addEventListener("input", function() {
            const value = slider.value;
            image.src = "foto" + value + ".jpg";
            imageNumber.textContent = value;
        });
    </script>
</body>
</html>
